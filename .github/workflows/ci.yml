name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify the built site as browsers and agents see it
        run: |
          npx vite preview --port 4173 --strictPort &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          AGENT_READABILITY_BASE_URL=http://127.0.0.1:4173 npm run verify:agent-readability
